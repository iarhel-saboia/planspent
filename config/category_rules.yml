# Palavras-chave usadas para categorizar lançamentos pela descrição.
#
# - A comparação ignora maiúsculas, acentos e pontuação: "IFD*BURGER" vira "ifd burger".
# - Cada palavra-chave precisa aparecer inteira na descrição ("bar" não pega "barbearia").
# - As categorias são testadas na ordem deste arquivo e a primeira que tiver uma palavra encontrada vence,
#   por isso as mais específicas vêm antes (Assinaturas antes de Compras, Transferências por último).
# - Correções feitas na tela têm prioridade sobre estas regras e ficam memorizadas.
# - O nome da categoria precisa ser igual ao cadastrado. Reinicie o servidor depois de editar.

